[project]
name = "signaldesk"
version = "0.1.0"
description = "Post-market drug safety signal intelligence: FAERS disproportionality analysis with citation-grounded retrieval"
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }

dependencies = [
  "django~=5.1",
  "djangorestframework~=3.15",
  "drf-spectacular~=0.27",
  "django-htmx~=1.19",
  "django-prometheus~=2.3",
  "django-ratelimit~=4.1",
  "psycopg[binary]~=3.2",
  "pgvector~=0.3",
  "celery[redis]~=5.4",
  "redis~=5.1",
  "duckdb~=1.1",
  "pyarrow~=17.0",
  "polars~=1.9",
  "numpy~=2.1",
  "scipy~=1.14",
  "pandas~=2.2",
  "httpx~=0.27",
  "tenacity~=9.0",
  "pydantic~=2.9",
  "pydantic-settings~=2.5",
  "structlog~=24.4",
  "orjson~=3.10",
  "jinja2~=3.1",
  "typer~=0.12",
  "rich~=13.9",
  "lxml~=5.3",
  "pysbd~=0.3",
  "bm25s~=0.2",
  "PyStemmer~=2.2",
  "pyyaml~=6.0",
  "gunicorn~=23.0",
]

[project.optional-dependencies]
ml = [
  "torch~=2.4",
  "transformers~=4.45",
]
# Mirrors the dev dependency group below. Both exist because local work uses
# "uv sync", which reads dependency groups, while the image installs an extra:
# "uv pip install --group" is not available in the uv release the image pins.
# Keep the two lists identical.
dev = [
  "ruff~=0.6",
  "mypy~=1.11",
  "pytest~=8.3",
  "pytest-django~=4.9",
  "pytest-cov~=5.0",
  "pytest-xdist~=3.6",
  "hypothesis~=6.112",
  "respx~=0.21",
  "freezegun~=1.5",
  "factory-boy~=3.3",
  "django-stubs[compatible-mypy]~=5.1",
  "djangorestframework-stubs~=3.15",
  "types-pyyaml",
]

[project.scripts]
signaldesk = "signaldesk.cli:app"

[dependency-groups]
dev = [
  "ruff~=0.6",
  "mypy~=1.11",
  "pytest~=8.3",
  "pytest-django~=4.9",
  "pytest-cov~=5.0",
  "pytest-xdist~=3.6",
  "hypothesis~=6.112",
  "respx~=0.21",
  "freezegun~=1.5",
  "factory-boy~=3.3",
  "django-stubs[compatible-mypy]~=5.1",
  "djangorestframework-stubs~=3.15",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/migrations/*.py" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/signaldesk"]
exclude = ["migrations"]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
warn_unreachable = true
disallow_any_explicit = false

[tool.django-stubs]
django_settings_module = "signaldesk.web.config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "signaldesk.web.config.settings.test"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "unit: no network, no database, no containers",
  "integration: requires postgres and redis",
  "e2e: full pipeline over the fixture slice",
]

[tool.coverage.run]
source = ["src/signaldesk"]
omit = ["*/migrations/*", "*/config/settings/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
